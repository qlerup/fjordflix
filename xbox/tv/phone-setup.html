<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log ind på Xbox · FjordFlix</title>
<style>*{box-sizing:border-box}body{margin:0;padding:32px 20px;background:#101516;color:#f3f5f4;font:16px system-ui,sans-serif}main{max-width:440px;margin:24px auto}.brand{color:#83e8bc;font-weight:700;letter-spacing:3px;font-size:13px}h1{font-size:32px;line-height:1.15;margin:22px 0 12px}p{line-height:1.6;color:#adbdb8}label{display:block;margin:22px 0 8px}input,button{width:100%;font:inherit;border-radius:12px;padding:15px}input{background:#1c2926;border:1px solid #4d655b;color:inherit;min-width:0}input:focus{outline:2px solid #83e8bc;outline-offset:2px}button{margin-top:28px;border:0;background:#83e8bc;color:#101516;font-weight:700;cursor:pointer}button:disabled{opacity:.6}#status{min-height:30px;overflow-wrap:anywhere}small{color:#adbdb8;line-height:1.6;display:block;margin-top:20px}</style></head>
<body><main><div class="brand">FJORD FLIX</div><h1>Din biograf på Xbox.</h1><p>Indtast dine oplysninger her. Xboxen klarer resten.</p>
<form id="setup"><label for="server">FjordFlix-server</label><input id="server" name="server" placeholder="film.gleruphub.dk eller 192.168.1.10:8096" inputmode="url" autocapitalize="none" spellcheck="false" maxlength="256" required>
<label for="name">Brugernavn</label><input id="name" name="name" autocomplete="username" maxlength="128" required>
<label for="password">Adgangskode</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
<button id="submit">Log ind på Xbox</button></form><p id="status" role="status" aria-live="polite"></p><small>Denne midlertidige side ligger på din Xbox og lukker efter login eller fem minutter. Telefon og Xbox skal være på samme lokalnetværk.</small></main>
<script>(function(){var form=document.getElementById('setup'),button=document.getElementById('submit'),status=document.getElementById('status'),password=document.getElementById('password');form.onsubmit=function(event){event.preventDefault();button.disabled=true;status.textContent='Kontakter din FjordFlix-server…';var xhr=new XMLHttpRequest();xhr.open('POST',location.pathname+'login');xhr.timeout=15000;xhr.setRequestHeader('Content-Type','application/json');function failed(message){password.value='';button.disabled=false;status.textContent=message;}xhr.onload=function(){var result={};try{result=JSON.parse(xhr.responseText);}catch(e){}if(xhr.status===200&&result.ok){password.value='';form.hidden=true;status.textContent='Du er logget ind. Fortsæt på din Xbox.';}else failed(result.error||'Login mislykkedes. Kontrollér oplysningerne og prøv igen.');};xhr.onerror=xhr.ontimeout=function(){failed('Xboxen kunne ikke kontaktes. Kontrollér at login-siden stadig er åben på Xboxen.');};xhr.send(JSON.stringify({server:document.getElementById('server').value,name:document.getElementById('name').value,password:password.value}));};}());</script></body></html>
