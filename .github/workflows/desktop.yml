name: Build Windows desktop
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: ./desktop/prepare.ps1
        shell: pwsh
      - run: npm test
        working-directory: desktop
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag must match desktop/package.json version' }
      - run: npm run dist -- --publish never
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: FjordFlix-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
      - name: Publish desktop update
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG desktop/dist/FjordFlix-Setup.exe desktop/dist/FjordFlix-Setup.exe.blockmap desktop/dist/latest.yml --verify-tag --title "FjordFlix Windows $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
