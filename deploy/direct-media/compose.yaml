name: fjordflix-media-gateway
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:?Set MEDIA_DOMAIN to your DNS-only media hostname}
      MEDIA_UPSTREAM: ${MEDIA_UPSTREAM:-host.docker.internal:8097}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  caddy-data:
  caddy-config:
