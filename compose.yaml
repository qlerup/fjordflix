name: fjordflix
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8096:8080"
    gpus: all
    volumes:
      - fjordflix-data:/data
    environment:
      MAX_TRANSCODES: "3"
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:-}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-}
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  fjordflix-data:
